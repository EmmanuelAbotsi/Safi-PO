services:
  - type: web
    name: safi-po
    runtime: node
    buildCommand: npm --prefix backend ci
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
