<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Procurement Management System - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-header">
                <h1>Procurement Management System</h1>
                <p>Sign in to continue</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="loginBtn"
                    class="btn-primary"
                >
                    Sign In
                </button>

                <div
                    id="loginMessage"
                    class="message"
                    style="display: none;"
                ></div>

            </form>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
